# Lint, type check and unit tests: once a day on main, on pull requests, and by hand (Actions → CI → Run
# workflow). No database tests here: there is only one Supabase project (production), so nothing in CI
# talks to Supabase and no secrets are needed.
name: CI

# GitHub's free plan has 2,000 minutes a month. Running on every push used them all by 2026-11-21 (about 30
# pushes a day at ~3 minutes each, round 678). Every round already runs these checks on the computer
# before pushing (CLAUDE.md), so CI is the daily safety net now: about 90 minutes a month.
on:
  schedule:
    - cron: "17 11 * * *" # 11:17 UTC, early morning in Texas
  workflow_dispatch:
  pull_request:
    paths-ignore: ["**/*.md", "docs/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Color contrast (WCAG)
        # Reported, not blocking (round 602): it had crashed since the glossy redesign's see-through
        # colors; fixed, it lists 10 pairs below the minimum (light-theme game badges at 3.9-4.4:1, and
        # a flat-red pair the jelly buttons don't use). Those are design choices for Matthew; until then
        # the run stays green so it flags real breakage.
        continue-on-error: true
        run: npm run check:contrast
